name: 24/7 自动抓取更新日剧 & 电影看板

on:
  schedule:
    # 设定 Cron 定时任务：每 2 小时云端自动抓取并更新一次
    - cron: '0 */2 * * *'
  workflow_dispatch: # 支持在 GitHub 页面上手动点击一键立即更新

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v3

      - name: 配置 Python 环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 安装抓取依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: 运行爬虫抓取最新日剧/电影/海报/简介
        run: |
          python code_artifact.py || python run.py

      - name: 自动提交并部署最新网页到 GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add japan_media_data.json index.html || true
          git commit -m "🤖 [24/7 Auto-Update] 每2小时自动拉取最新日剧电影与简介 [skip ci]" || exit 0
          git push
