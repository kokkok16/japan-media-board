  <script>
    const dataContainer = {"updated_at": "2026-10-01 19:25:08", "total_count": 10, "items": [{"id": "bgm_m_79397", "title": "高铁英雄 剧场版", "poster_url": "https://lain.bgm.tv/pic/cover/l/e0/1c/79397_lNa5X.jpg", "score": "8.2", "category": "日本电影", "season": "最新日本电影", "air_date": "2013-08-16", "summary": "　　获广电总局重点推荐 宣扬梦想与正能量\r\n　　2100年，世界铁路协会成立。它从全世界召集了装载着人工智能的8名列车精英，他们积极投身到了各种救援活动中，隧道坍塌、行星坠落…… \r\n　　被人类重新研发的卫星“缪斯”发射升空，她探测到一个巨大的陨石正向着阿雷斯塔黎亚国方向落去，而这，其实是阿托拉斯宇宙中心十年前成功发射的一颗人造卫星——奥立昂的巨大阴谋…… \r\n　　这次，奥立昂的诡计能否得逞？高铁英雄们将会有怎样的命运？地球是否会遭遇灭顶之灾？ \r\n　　一切尽在《高铁英雄》……"}, {"id": "bgm_m_3022", "title": "剧场版宝可梦: 超梦的逆袭", "poster_url": "https://lain.bgm.tv/pic/cover/l/c8/86/3022_v7H3d.jpg", "score": "8.2", "category": "日本电影", "season": "最新日本电影", "air_date": "1998-07-18", "summary": "立志成为神奇宝贝大师的小智一行人依然继续踏上旅程。这天，当小智与训练家的战斗结束之后，他们收到一封由快龙送来的神秘招待券。招待券里面写著：‘你们是最被看好、最有前途的宝可梦训练家，我以最强的宝可梦训练家的身份，邀请你们来参加我的宴会。’“最强的宝可梦训练家？”好奇的小智他们毫不考虑地朝向新岛的神奇宝贝城出发！当一行人到达港口时，却因为天候不佳，前往新岛的船只暂停行驶。港口管理员波佳为了不让神奇宝贝和他们遭到任何的意外，坚决不让众人出航，女警君莎也赞同波佳的看法。\r\n\r\n一位名叫海男的男孩，他打算搭乘神奇宝贝渡海，而另外两位训练家空男和小甜也附和海男的作法，搭乘神奇宝贝渡海。正当小智烦恼无法前往新岛之际，港口出现了一艘小船，船上维京人打扮的船家答应在小智他们渡海。正当众人在海中央之时，突然一个大浪打来，让操纵小船的船家露出了真面目。什么？竟然是火箭队那三个捣蛋鬼！！正当火箭队要说出那套可爱又迷人的台词之时，小船竟然被大浪打翻了！小智和小霞赶紧叫出杰尼龟和宝石海星让众人紧捉，才不至于被大浪卷走。\r\n\r\n在到达新岛之后，一名很像宝可梦中心护士乔伊的女子带领小智一行人前往神奇宝贝城。海男、空男和小甜果然已经到了。当领路的女子介绍最强的神奇宝贝训练家出场时，没想到出现在众人面前的竟然是……超梦？"}, {"id": "bgm_m_37632", "title": "超电影版 SD高达三国传", "poster_url": "https://lain.bgm.tv/pic/cover/l/46/ac/37632_610d1.jpg", "score": "8.2", "category": "日本电影", "season": "最新日本电影", "air_date": "2010-02-27", "summary": "伝説の大陸「三璃紗」は暴虐の太師 董卓（とうたく）ザクによって支配されていた。董卓の悪政によって、三璃紗全土は闇に包まれ、民は絶望にうちひしがれていた。\r\n \r\n民を救うため立ち上がったのは幽州の義勇軍、劉備ガンダム、関羽ガンダム、張飛ガンダムの3人。彼らを迎え撃つのは董卓軍「鎮江将軍 胡軫（こしん）ギャン」。\r\n \r\n激しい戦いの末、窮地を逃れた劉備、関羽、張飛は、山奥の隠れ里に住む、ある少年に助けられる。"}, {"id": "bgm_m_321", "title": "机动警察剧场版2 和平保卫战", "poster_url": "https://lain.bgm.tv/pic/cover/l/ca/f1/321_j3YWy.jpg", "score": "8.2", "category": "日本电影", "season": "最新日本电影", "air_date": "1993-08-07", "summary": "若干年前，陆上自卫队某战车小队在东南亚某处遭遇袭击，除队长柘植行人外，全军覆没。\r\n时间又回到今天，海湾大桥突然爆炸，民间一度陷入恐慌。一位名叫荒川茂树，自称是自卫队调查部的人找到后藤与南云，告诉他本次事件的真实情况是由不明身份的战斗机发射导弹袭击大桥所致，同时他认为已经失踪许久的柘植行人是最大的嫌疑犯。正当后藤他们拜托松井协助调查的时候，日本各地却纷纷出现空袭的虚假警报，其目的大都是东京圈。为此军队与警察等部门也陷入了彼此对立、不知所措的困境中。为了防范未然，政府调动部分忠于自己的自卫队进驻东京。\r\n在松井不懈的努力下，终于查到柘植行人的蛛丝马迹，南云亦已察觉到这个昔日的恋人正是此次动乱的策划人。不过由于荒川的参入，柘植行人没有再与南云接触，他彻底消失在了夜幕中。\r\n恐怖的前兆终于发生：东京的通讯系统突然完全瘫痪，驻扎在市内各处的部队也变成了如盲人般，根本无法有效行动。而此时，满载着毒气的巨大飞艇正在接近这个不设防的城市....."}, {"id": "bgm_m_9979", "title": "机动警察剧场版1 东京毁灭战", "poster_url": "https://lain.bgm.tv/pic/cover/l/12/99/9979_BK8B4.jpg", "score": "8.2", "category": "日本电影", "season": "最新日本电影", "air_date": "1989-07-15", "summary": "　　一部军用的机械人在无人的情况自动启动、一个名为帆场瑛一的篠原重工天才程序员自杀；谁也没想到，两起无关事件却会在将来把东京带入恐怖中。\r\n　　东京各处陆续发生了一系列机械人暴走的事情，经过特车2课的调查，发现可疑之处是一套新推出的机械人操作系统：HOS，而该OS是篠原重工的作品。更为严重的是眼下大部分的机械人都已更换为此系统，所以后藤他们认为潜在的危机是十分可怕的(如果东京内的大部分机械人一起暴走，那么东京就将毁灭)。但是没有任何的证据证明机械人暴走与HOS有关，为此后藤委托松井刑事协助调查。当调查到HOS主创人员帆场时，发现他早已把自己的过去资料抹去，唯有他的住处记录还存在着。松井追随着几年来帆场所暂住的地方，却惊异的发现帆场在这几年内竟然搬过20几次家，而每当线索带着他们来到其中的某一处地方时，那里似乎都是被新时代建筑所淘汰的过去回忆，时间的脚步仿佛已经开始在慢慢倒转着。甚至松井也不禁在怀疑：难道是帆场瑛一刻意带着他来看到这些被人们遗忘的角落？他到底想告诉我们什么？\r\n　　同时，特车2课第2小队的各位并没有闲着，在繁夫的帮助下，他们似乎找到了机械人暴走的条件：当风速达到40/S时与建筑物之间产生的共鸣，会使HOS中的隐藏功能对这个现象做出反映。而他们也意识到了：东京市内可以使所有机械人同时发狂的共鸣物，就是那个“巴比伦计划”、那个高耸入云的建筑、那个代表着人类欲望与技术结晶的建筑！此时电视传来了气象预报的声音：“预计今夜风速达40/S的台风将登陆东京，请做好防范准备......”"}, {"id": "bgm_m_47667", "title": "未来少年柯南 剧场版", "poster_url": "https://lain.bgm.tv/pic/cover/l/01/da/47667_2d82W.jpg", "score": "8.2", "category": "日本电影", "season": "最新日本电影", "air_date": "1979-09-01", "summary": "NHKのテレビシリーズをまとめた総集編『未来少年コナン』が1979年に劇場公開された。"}, {"id": "bgm_m_335298", "title": "面包超人剧场版 发光吧！冰淇淋王国的香草公主", "poster_url": "https://lain.bgm.tv/pic/cover/l/01/93/335298_xHKJx.jpg", "score": "8.2", "category": "日本电影", "season": "最新日本电影", "air_date": "2019-06-28", "summary": "　　《面包超人剧场版 发光吧！冰淇淋王国的香草公主》描述面包超人与同伴们要闯入冰淇淋王国，勇于帮助“香草公主”找回她的能力，更要防止细菌人的入侵，恢复王国的荣辉。 　　冰淇淋王国每年都会制作美味冰淇淋，送到全世界！但是，冰淇淋王国的公主──香草公主，却做不出冰淇淋，难过地离开了王国。她遇见面包超人之后，慢慢了解制作冰淇淋的重要关键。此时，细菌人打算将冰淇淋王国变成细菌冰淇淋王国，发明了最强机器人“细菌冰机器人”，到处捣乱！面包超人跟香草公主能不能打败细菌人，拯救冰淇淋王国呢？"}, {"id": "bgm_m_19017", "title": "黑猫警长", "poster_url": "https://lain.bgm.tv/pic/cover/l/6d/3b/19017_b02TL.jpg", "score": "8.2", "category": "日本电影", "season": "最新日本电影", "air_date": "2010-04-23", "summary": "大森林里，小动物们友好相处，互帮互助，过着幸福安宁的生活，而为这片和平充当保护者，就是大名鼎鼎的黑猫警长。每天，警长都和森林警察局的勇士们一起巡逻，监听一切可疑的声音。是的，即使是在如此美丽的大森林里，依然有心怀叵测的坏蛋和蠢蠢欲动的不良分子时刻觊觎着大森林居民的劳动果实。比如偷吃红土的懒惰三人组，席卷庄稼地的蝗虫大军，其中最最冥顽狡猾的便是搬仓鼠一只耳为首的犯罪团伙。他曾从黑猫警长的手中逃脱，却丝毫不吸取教训，从各地乃至海外找来同伙复仇。无论有多大的危险，黑猫警长也决不退缩，带领战友们一次次冲向战斗的最前线。 \r\n\r\n本片根据同名经典动画剧集剪辑而成。"}, {"id": "bgm_m_299264", "title": "西行纪之再见悟空", "poster_url": "https://lain.bgm.tv/pic/cover/l/33/f6/299264_f5wH7.jpg", "score": "8.2", "category": "日本电影", "season": "最新日本电影", "air_date": "2020-05-04", "summary": "天界公主素衣在凡间与孙悟空结识，情投意合。但悟空却被其他天神当成凡间妖物暴力对待，镇压在了五指山下。三百年来，如来大神用行动感化悟空，教会悟空如何坚守心中正义。孙悟空保护唐三藏前往彼岸世界取回创世之火以造福世间，历经波折后终于归来，却发现巨大的阴谋浮出水面，师徒几人的命运也就此被改写。"}, {"id": "bgm_m_139663", "title": "樱桃小丸子：来自意大利的少年", "poster_url": "https://lain.bgm.tv/pic/cover/l/9c/5f/139663_13JzM.jpg", "score": "8.2", "category": "日本电影", "season": "最新日本电影", "air_date": "2015-12-23", "summary": "　　23年后，樱桃小丸子终于有了她的第三部剧场版。 为了纪念TV动画播放25周年，《樱桃小丸子》将再次登上大银幕。上周末，小丸子官方网站发布了剧场版的预告片，并确定将于今年12月23日上映。 本次剧场版将由漫画原作者樱桃子（本名三浦美纪）亲自担任脚本制作，《樱桃小丸子》动画导演高木淳执导。讲述以清水市为起点，作品史上第一次的大阪、京都旅行。在新的剧场版里，来自英国、中国、美国等六个国家的小孩子将拜访樱桃小丸子的家乡清水市，小丸子将会和他们一起去东京和大阪旅行。其中，来自意大利的一位小正太喜欢上了小丸子并向她表白。 影片将在今年12月23日圣诞档期上映。"}]};
    let allData = dataContainer.items || [];

    function getPosterUrls(url) {
      if (!url) return [];
      return [
        url,
        'https://images.weserv.nl/?url=' + encodeURIComponent(url)
      ];
    }

    function handleImgError(img) {
      const fallbackList = JSON.parse(img.dataset.fallbacks || '[]');
      const currentIndex = parseInt(img.dataset.failCount || '0', 10);
      
      if (currentIndex < fallbackList.length) {
        img.dataset.failCount = currentIndex + 1;
        img.src = fallbackList[currentIndex];
      } else {
        img.src = "data:image/svg+xml;charset=UTF-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22200%22%20height%3D%22300%22%20viewBox%3D%220%200%20200%20300%22%3E%3Crect%20fill%3D%22%23e0e0e0%22%20width%3D%22200%22%20height%3D%22300%22%2F%3E%3Ctext%20fill%3D%22%23888888%22%20font-family%3D%22sans-serif%22%20font-size%3D%2216%22%20text-anchor%3D%22middle%22%20x%3D%22100%22%20y%3D%22150%22%3E🎬%20海报加载中%3C%2Ftext%3E%3C%2Fsvg%3E";
        img.onerror = null;
      }
    }

    function renderGrid(items) {
      const grid = document.getElementById('media-grid');
      grid.innerHTML = '';
      items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        const urls = getPosterUrls(item.poster_url);
        const primaryUrl = urls[0] || '';
        const fallbacks = JSON.stringify(urls.slice(1));

        card.innerHTML = `
          <div class="poster-box">
            <img src="${primaryUrl}" 
                 data-fallbacks='${fallbacks}' 
                 data-fail-count="0" 
                 onerror="handleImgError(this)" 
                 alt="${item.title}" 
                 loading="lazy">
          </div>
          <div class="card-info">
            <div class="tags">
              <span class="tag">${item.category || '日剧'}</span>
              <span class="tag season-tag">${item.season || '热播'}</span>
            </div>
            <div class="title">${item.title}</div>
            <div class="score">⭐ 评分: ${item.score}</div>
          </div>
        `;
        card.addEventListener('click', () => openModal(item, primaryUrl, fallbacks));
        grid.appendChild(card);
      });
    }

    function openModal(item, primaryUrl, fallbacks) {
      const modalImg = document.getElementById('modal-poster');
      modalImg.dataset.fallbacks = fallbacks;
      modalImg.dataset.failCount = "0";
      modalImg.src = primaryUrl;

      document.getElementById('modal-tag').innerText = item.category || '日剧';
      document.getElementById('modal-season').innerText = item.season || '最新';
      document.getElementById('modal-title').innerText = item.title;
      document.getElementById('modal-score').innerText = `⭐ 评分: ${item.score}`;
      document.getElementById('modal-summary').innerText = item.summary || '暂无详细故事简介。';
      document.getElementById('modal-overlay').classList.add('active');
    }

    function filterData() {
      const searchText = document.getElementById('search-input').value.toLowerCase();
      const catVal = document.getElementById('category-filter').value;
      const seasonVal = document.getElementById('season-filter').value;

      const filtered = allData.filter(item => {
        const matchSearch = item.title.toLowerCase().includes(searchText);
        const matchCat = catVal === 'ALL' || item.category === catVal;
        const matchSeason = seasonVal === 'ALL' || (item.season && item.season.includes(seasonVal));
        return matchSearch && matchCat && matchSeason;
      });
      renderGrid(filtered);
    }

    document.getElementById('search-input').addEventListener('input', filterData);
    document.getElementById('category-filter').addEventListener('change', filterData);
    document.getElementById('season-filter').addEventListener('change', filterData);
    document.getElementById('modal-close').addEventListener('click', () => document.getElementById('modal-overlay').classList.remove('active'));

    window.onload = () => {
      renderGrid(allData);
    };
  </script>
</body>
</html>
